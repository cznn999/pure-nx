# Pure Xbox 360 codegen overrides.
# Add entries only after reviewing codegen diagnostics and guest code.

# pure-nx (2026-11-07): the optimised codegen of renut-nx / sa2-nx (renut-nx app/renut_config.toml; masseffect-nx measured
# the set on the console). Only the shape of the C++ changes, so the compiler keeps guest state in host registers:
#   - cr0-cr7, ctr, xer and the lwarx reservation as C++ locals;
#   - skip_msr: no mfmsr/mtmsrd fences, ctx.msr stores or global lock around guest atomic sequences (a stwcx. is already
#     a compare-and-swap);
#   - dform_disp_split: D-form loads/stores as base + zext(reg) + disp (differs only when reg + disp crosses 2^32, a
#     guest fault either way);
#   - fctiwz_inline, fcti_inline: the float-to-integer conversions inline, rounding halves to even as the Xbox 360.
# After every codegen.cmd: python tools\post_codegen_pure.py (the generator writes the plain text back).
# Back to the plain codegen: delete these lines and run codegen.cmd.
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
fcti_inline = true
# fp_moves_modeless: a float load, store or move does not switch the FPU between IEEE and VMX flush mode (only
# arithmetic does); renut-nx: msr fpcr -22.8 % in the ELF, the same guest results.
fp_moves_modeless = true
# pure-nx (2026-11-07, pure_004: the race's main thread far over the frame; the user wants only exact optimisations):
# renut-nx's / sa2-nx's other exact generator options (renut-nx app/renut_config.toml and docs/codegen-enhancements.md
# have the measurements; each one unit-tested exact by sa2-nx / banjo-nx, none game-specific):
#   - dcbt_prefetch: the game's dcbt / dcbtst hints as the host's prefetch of the same address ({CT, RA, RB}: the SDK
#     has banjo-nx's operand fix). A prefetch never faults and changes no value.
#   - rotate_word_shifts: rlwinm / rlwimi whose mask does not wrap as one shift / extract (renut-nx: -0.54 %).
#   - fp_compares_modeless: fcfid, fctiwz, fctidz and fsel switch no flush mode; fcmpu / fcmpo / frsp through any-mode
#     helpers while VMX mode is current.
#   - fp_mode_lookahead (+ _past_branch): lfs / stfs / frsp / fcmpu and short scalar runs in front of vector code
#     compute in the current mode instead of switching (renut-nx: flush-mode switches -38 %; each one an msr fpcr).
#   - fp_copy_pairs, fp_copy_forwarding: lfs -> stfs copies write the loaded bits without a mode.
#   - div_inline: divw / divwu / divd / divdu through rex::ppc helpers (AArch64 defines a zero divisor and INT_MIN / -1).
# Needs codegen.cmd, then tools\post_codegen_pure.py.
dcbt_prefetch = true
rotate_word_shifts = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = true
fp_copy_pairs = true
fp_copy_forwarding = true
div_inline = true
# pure-nx (2026-11-08, "the diet"; nfsmw-nx docs/toolchain.md, renut-nx app/renut_config.toml): r14-r31, f14-f31,
# v14-v31 / v64-v127 as C++ locals instead of ctx, so every function's __savegprlr_N / __restgprlr_N calls (stores and
# loads of up to 18 registers through guest memory, on every call) go away: nfsmw-nx about 14 % of its main thread,
# renut-nx -4.5 % instructions and -11 % stores. Exact once every split piece that reads a register its parent set is
# marked share_registers: build_switch_diet.cmd runs tools\diet_marks_pure.py (tools\read_before_write.py, renut-nx's
# flow-sensitive audit) between two codegen runs and stops if a piece is left unmarked. No Pure hook reads a caller's
# r14-r31 / f14-f31 (checked 2026-11-08). Not taken: non_argument_as_local (nfsmw-nx: breaks __savevmx's r12),
# elide_lr_stores (renut-nx keeps it behind its own audit).
non_volatile_as_local = true
# pure-nx (2026-11-08): the guest CRT setjmp (0x82F750D0) and longjmp (0x82F748B0), reached only through the jump
# thunks 0x830A4CC8 / 0x82FEDA08 (the bl targets: 10 setjmp calls, 24 longjmp calls, all in the D3DX/HLSL compiler code
# 0x82A5xxxx-0x82D2xxxx). Before this, the recompiled longjmp just returned to its caller, so the code after an error
# call (0x8301D778 -> 0x82B8AAC8 -> 0x82B8A6C0 -> longjmp) ran on. With the diet that code read r14-r31 locals never
# written, read_before_write.py flagged 30 normal functions there, their share_registers marks clobbered their callers'
# registers (copyBack) and the diet build crashed in sub_82C7D6D0 (garbage pointer +0x254). Now setjmp/longjmp are host
# setjmp/longjmp (ppc_setjmp / ppc_longjmp in the pch, locals saved and restored by the codegen), and the audit sees
# ppc_longjmp as a path end.
# pure-nx (2026-11-08, the codegen round with build_switch_turbo.cmd): no `ctx.lr = <return address>;` before every
# call (renut-nx's diet half, with non_volatile_as_local: masseffect-nx -10 % on its main thread for both). ctx.lr is
# read only by diagnostics (pure_frame_probe's wait callers; its guest profile, now off by default); the generator keeps
# the store where the LR is read as data (a PIC `bl` to a local label). The game raised no SEH in any run (rex_profile).
elide_lr_stores = true

setjmp_address = 0x830A4CC8
longjmp_address = 0x82FEDA08


# Pure (pure-nx): your settings. This file is written beside pure.nro when it is missing; the build's fixed settings
# are compiled in (pure_switch_defaults.toml) and any key here overrides them.
#
# Graphics (the values below are the defaults; change them here):
renut_resolution = "480p"      # internal resolution: 480p, 720p (the game's own), 1080p; upscaled to the screen
pure_fsr = true                # FSR-style sharp upscaling; false = plain bilinear
pure_fsr_sharpness = 0.3       # 0.0-2.0

# Controller layout: true = face buttons by position (Xbox layout), false = by letter
input_xbox_layout = true
# L+R+ZR opens the Switch controller menu (connect a second controller, split Joy-Cons); off by default
input_controller_applet_shortcut = false

# Logs (sdmc:/switch/pure-nx/logs/)
log_level = "info"
log_to_file = true

# Controls: which Switch buttons press each Xbox 360 button (read at start). Uncomment a line to change it.
# Buttons: A B X Y L R ZL ZR PLUS MINUS LSTICK RSTICK UP DOWN LEFT RIGHT SL SR, or NONE; several = "B, ZR".
# With input_xbox_layout = true (default) the face buttons go by position: Xbox A is the bottom button (Switch B),
# Xbox B the right one (Switch A), Xbox X the left one (Switch Y), Xbox Y the top one (Switch X).
[input_p1]
# a = "B"
# b = "A"
# x = "Y"
# y = "X"
# lb = "L"
# rb = "R"
# lt = "ZL"
# rt = "ZR"
# start = "PLUS"
# back = "MINUS"
# ls = "LSTICK"
# rs = "RSTICK"
# up = "UP"
# down = "DOWN"
# left = "LEFT"
# right = "RIGHT"
